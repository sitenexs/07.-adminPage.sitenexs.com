<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitenexs - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-main);
        }

        .admin-container {
            width: 100%;
            max-width: 1200px;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 40px;
        }

        .header {
            background: var(--card);
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(8px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header img {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: contain;
            background: var(--bg);
            padding: 4px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .header-info h1 {
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .header-info p {
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 2px;
        }

        .badge-admin {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .search-container {
            padding: 24px 24px 0 24px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 18px;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }

        .search-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-box input {
            border: none;
            outline: none;
            width: 100%;
            margin-left: 12px;
            font-size: 0.95rem;
            color: var(--text-main);
            background: transparent;
            font-weight: 500;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .menu-container {
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .menu-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 16px;
            margin-left: 4px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 768px) {
            .menu-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (min-width: 1024px) {
            .menu-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .menu-item {
            background: var(--card);
            display: flex;
            align-items: center;
            padding: 18px;
            border-radius: 14px;
            text-decoration: none;
            color: var(--text-main);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }

        .menu-item:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .menu-item:active {
            background: #f1f5f9;
            transform: scale(0.98);
        }

        .icon-box {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            margin-right: 16px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .menu-item:hover .icon-box {
            background: var(--primary);
            color: #ffffff;
        }

        .menu-text {
            flex: 1;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .arrow {
            color: var(--border);
            font-size: 0.85rem;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .menu-item:hover .arrow {
            color: var(--primary);
            transform: translateX(3px);
        }
    </style>
</head>
<body>
    <div class="admin-container">
        
        <header class="header">
            <div class="header-left">
                <img src="https://sitenexs.com/assets/logo/logo.png" alt="Sitenexs" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=S&background=2563eb&color=fff';">
                <div class="header-info">
                    <h1>Control Panel</h1>
                    <p>Admin Sitenexs</p>
                </div>
            </div>
            <div class="badge-admin">
                <i class="fas fa-shield-alt"></i> Active Session
            </div>
        </header>

        <div class="search-container">
            <div class="search-box">
                <i class="fas fa-search" style="color: var(--text-muted)"></i>
                <input type="text" id="searchInput" placeholder="Cari menu atau fitur...">
            </div>
        </div>

        <div class="menu-container">
            <div class="menu-title">Ringkasan Sistem & Manajemen</div>
            
            <div class="menu-grid" id="menuGrid">
                
                <!-- Menu Kelola Event -->
                <a href="https://adminpage.sitenexs.com/event" class="menu-item">
                    <div class="icon-box"><i class="fas fa-calendar-alt"></i></div>
                    <span class="menu-text">Kelola Event</span>
                    <i class="fas fa-chevron-right arrow"></i>
                </a>

                <a href="https://adminpage.sitenexs.com/verifikasi-centang-biru" class="menu-item">
                    <div class="icon-box"><i class="fas fa-check-circle"></i></div>
                    <span class="menu-text">Verifikasi</span>
                    <i class="fas fa-chevron-right arrow"></i>
                </a>

                <a href="https://adminpage.sitenexs.com/tim" class="menu-item">
                    <div class="icon-box"><i class="fas fa-laptop-code"></i></div>
                    <span class="menu-text">Tim Pengembang</span>
                    <i class="fas fa-chevron-right arrow"></i>
                </a>

                <a href="https://adminpage.sitenexs.com/tampilan/editPaketDiTampilanUtama" class="menu-item">
                    <div class="icon-box"><i class="fas fa-edit"></i></div>
                    <span class="menu-text">Edit paket di halaman utama</span>
                    <i class="fas fa-chevron-right arrow"></i>
                </a>

                <a href="https://adminpage.sitenexs.com/langgananUser/" class="menu-item">
                    <div class="icon-box"><i class="fas fa-file-invoice-dollar"></i></div>
                    <span class="menu-text">Paket & User</span>
                    <i class="fas fa-chevron-right arrow"></i>
                </a>

                <a href="https://adminpage.sitenexs.com/userBot" class="menu-item">
                    <div class="icon-box"><i class="fas fa-robot"></i></div>
                    <span class="menu-text">Kelola Bot</span>
                    <i class="fas fa-chevron-right arrow"></i>
                </a>

                <a href="https://adminpage.sitenexs.com/iklan" class="menu-item">
                    <div class="icon-box"><i class="fas fa-bullhorn"></i></div>
                    <span class="menu-text">Admin Iklan</span>
                    <i class="fas fa-chevron-right arrow"></i>
                </a>

                <a href="grafik.html" class="menu-item">
                    <div class="icon-box"><i class="fas fa-chart-pie"></i></div>
                    <span class="menu-text">Grafik Analitik</span>
                    <i class="fas fa-chevron-right arrow"></i>
                </a>

            </div>
        </div>

    </div>

    <script>
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const items = document.querySelectorAll('.menu-item');
            
            items.forEach(item => {
                const text = item.querySelector('.menu-text').innerText.toLowerCase();
                if(text.includes(term)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
