<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sitenexs — Pengaturan Paket, Fitur & Lencana Nama</title>
    
    <!-- Meta SEO -->
    <meta name="robots" content="noindex, nofollow">

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #10b981;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-alt: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1;
            --border-accent: #93c5fd;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 15px 30px -5px rgba(15, 23, 42, 0.08);
            --radius-sm: 0.375rem;
            --radius-md: 0.625rem;
            --radius-lg: 1rem;
            --radius-xl: 1.5rem;
            --radius-full: 9999px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 15px; }
        body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; -webkit-font-smoothing: antialiased; }
        a { text-decoration: none; color: inherit; }
        button, input, select, textarea { font-family: inherit; outline: none; }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; position: relative; z-index: 2; }

        .bg-grid-pattern {
            background-image: linear-gradient(to right, rgba(37, 99, 235, 0.06) 1px, transparent 1px), linear-gradient(to bottom, rgba(37, 99, 235, 0.06) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* NAVBAR */
        #navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-sm);
        }
        .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 76px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--text-main);
        }
        .logo-text {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-img {
            height: 38px;
            width: 38px;
            border-radius: var(--radius-full);
            object-fit: cover;
            border: 2px solid #fff;
            box-shadow: var(--shadow-sm);
        }

        /* TOAST NOTIFIKASI */
        .sitenexs-toast {
            position: fixed;
            top: 90px;
            right: 20px;
            background: #ffffff;
            color: var(--text-main);
            padding: 1rem 1.25rem;
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.15);
            border: 1px solid var(--border-subtle);
            z-index: 99999;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transform: translateY(-20px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sitenexs-toast.show { transform: translateY(0); opacity: 1; }
        .sitenexs-toast-icon {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(16, 185, 129, 0.15); color: #10b981;
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0;
        }
        .sitenexs-toast.error .sitenexs-toast-icon { background: rgba(239, 68, 68, 0.15); color: #ef4444; }

        /* MAIN CONTENT */
        .admin-wrapper { padding-top: 130px; padding-bottom: 5rem; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; flex-wrap: wrap; gap: 1rem; }
        .admin-title h1 { font-size: 1.8rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.02em; }
        .admin-title p { color: var(--text-muted); font-size: 0.95rem; margin-top: 0.2rem; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.7rem 1.4rem; font-size: 0.9rem; font-weight: 700; border-radius: var(--radius-full); transition: var(--transition); cursor: pointer; border: 1px solid transparent; text-align: center; }
        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #ffffff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35); }
        .btn-secondary { background-color: #ffffff; color: var(--text-main); border: 1px solid var(--border-medium); box-shadow: var(--shadow-sm); }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        .btn-danger { background-color: #ef4444; color: #fff; }
        .btn-danger:hover { background-color: #dc2626; }
        .btn-sm { padding: 0.4rem 0.9rem; font-size: 0.8rem; border-radius: var(--radius-sm); }

        /* GRID KELOLA PAKET */
        .packages-admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.75rem; }
        .package-admin-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: 2rem; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; position: relative; transition: var(--transition); }
        .package-admin-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--border-accent); }
        .package-admin-card.populer { border-top: 4px solid var(--primary); }
        .badge-populer-tag { position: absolute; top: 1.25rem; right: 1.25rem; background: var(--primary-light); color: var(--primary); font-size: 0.7rem; font-weight: 800; padding: 0.25rem 0.7rem; border-radius: var(--radius-full); }
        
        .pkg-icon-title { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        .pkg-icon-box { width: 46px; height: 46px; border-radius: var(--radius-md); background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
        .pkg-name { font-size: 1.25rem; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 0.4rem; }
        .pkg-name-badge { width: 20px; height: 20px; object-fit: contain; vertical-align: middle; }
        
        .pkg-desc { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 1.25rem; line-height: 1.5; min-height: 40px; }
        
        .pkg-price-box { background: var(--bg-alt); padding: 0.85rem; border-radius: var(--radius-md); margin-bottom: 1.25rem; }
        .pkg-price-strike { font-size: 0.82rem; color: #ef4444; text-decoration: line-through; font-weight: 600; display: block; }
        .pkg-price-final { font-size: 1.35rem; font-weight: 800; color: var(--text-main); }
        .pkg-countdown-badge { background: #fee2e2; color: #991b1b; font-size: 0.72rem; font-weight: 700; padding: 0.25rem 0.5rem; border-radius: var(--radius-sm); margin-top: 0.5rem; display: inline-flex; align-items: center; gap: 0.3rem; }
        
        .pkg-features-list { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem; list-style: none; flex-grow: 1; }
        .pkg-features-list li { margin-bottom: 0.4rem; display: flex; align-items: flex-start; gap: 0.5rem; }
        .pkg-features-list li img { width: 18px; height: 18px; object-fit: contain; vertical-align: middle; display: inline-block; margin-left: 3px; }
        .pkg-features-list li.disabled img { opacity: 0.4; filter: grayscale(100%); }
        
        .pkg-actions { display: flex; gap: 0.75rem; border-top: 1px solid var(--border-subtle); padding-top: 1.25rem; }

        /* ICON PICKER GRID */
        .icon-picker-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.5rem; margin-top: 0.5rem; max-height: 140px; overflow-y: auto; padding: 0.25rem; border: 1px solid var(--border-medium); border-radius: var(--radius-md); background: var(--bg-body); }
        .icon-option { height: 40px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); background: #ffffff; cursor: pointer; font-size: 1.1rem; color: var(--text-muted); transition: var(--transition); }
        .icon-option:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
        .icon-option.selected { background: var(--primary); color: #ffffff; border-color: var(--primary); box-shadow: var(--shadow-sm); }

        /* FEATURE BUILDER STYLES */
        .feature-builder-container { display: flex; flex-direction: column; gap: 0.6rem; max-height: 250px; overflow-y: auto; padding: 0.25rem; }
        .feature-row-item { display: flex; align-items: center; gap: 0.5rem; background: var(--bg-alt); padding: 0.5rem; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); }
        .feature-status-select { padding: 0.5rem; border-radius: var(--radius-sm); border: 1px solid var(--border-medium); background: #fff; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
        .feature-text-input { flex: 1; padding: 0.5rem 0.75rem; border-radius: var(--radius-sm); border: 1px solid var(--border-medium); background: #fff; font-size: 0.88rem; }
        .feature-badge-input { width: 130px; padding: 0.5rem 0.75rem; border-radius: var(--radius-sm); border: 1px solid var(--border-medium); background: #fff; font-size: 0.82rem; }
        .btn-remove-feature { background: #fee2e2; color: #ef4444; border: none; width: 36px; height: 36px; border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--transition); flex-shrink: 0; }
        .btn-remove-feature:hover { background: #ef4444; color: #fff; }

        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); z-index: 9999; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { position: relative; width: 100%; max-width: 720px; background: #ffffff; border-radius: var(--radius-xl); padding: 2.5rem; margin: 1.5rem; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); transform: scale(0.95) translateY(10px); transition: all 0.3s ease; }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 1rem; }
        .modal-title { font-size: 1.35rem; font-weight: 800; color: var(--text-main); }
        .modal-close { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
        .modal-close:hover { background: rgba(239, 68, 68, 0.1); color: #ef4444; }

        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--text-main); }
        .form-control { width: 100%; padding: 0.8rem 1rem; border-radius: var(--radius-md); border: 1px solid var(--border-medium); background-color: var(--bg-body); font-size: 0.95rem; color: var(--text-main); transition: var(--transition); }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); background-color: #ffffff; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-checkbox-label { display: flex; align-items: center; gap: 0.6rem; font-weight: 600; cursor: pointer; font-size: 0.92rem; }
        .form-checkbox-label input { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }

        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; gap: 0; }
            .modal-content { padding: 1.5rem; }
            .icon-picker-grid { grid-template-columns: repeat(4, 1fr); }
            .feature-row-item { flex-direction: column; align-items: stretch; }
            .feature-badge-input { width: 100%; }
        }
    </style>
</head>

    <div id="packageModal" class="modal-overlay">

        import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
        import { getFirestore, collection, getDocs, doc, setDoc, addDoc, updateDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyDuN4zlRaSnmcUSuXE_E84IE7d3Mz8E-N4',
            authDomain: 'sitenexs-62919.firebaseapp.com',
            projectId: 'sitenexs-62919',
            storageBucket: 'sitenexs-62919.firebasestorage.app',
            messagingSenderId: '1060348110644',
            appId: '1:1060348110644:web:e45af14d5f26a9cf8e6761',
            measurementId: 'G-C7YL0Q7YRQ'
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const gridContainer = document.getElementById('admin-packages-grid');
        const packageModal = document.getElementById('packageModal');
        const btnOpenAddModal = document.getElementById('btnOpenAddModal');
        const btnCloseModal = document.getElementById('btnCloseModal');
        const btnCancelModal = document.getElementById('btnCancelModal');
        const packageForm = document.getElementById('packageForm');
        const modalTitleID = document.getElementById('modalTitleID');
        const iconInput = document.getElementById('icon');
        const iconOptions = document.querySelectorAll('.icon-option');
        const featureRowsContainer = document.getElementById('featureRowsContainer');
        const btnAddFeatureRow = document.getElementById('btnAddFeatureRow');

        // Setup format input Rupiah otomatis berbantuan titik
        function formatRupiahInput(value) {
            let numberString = value.replace(/[^,\d]/g, '').toString();
            let split = numberString.split(',');
            let sisa = split[0].length % 3;
            let rupiah = split[0].substr(0, sisa);
            let ribuan = split[0].substr(sisa).match(/\d{3}/gi);

            if (ribuan) {
                let separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }
            return split[1] !== undefined ? rupiah + ',' + split[1] : rupiah;
        }

        function parseRupiahToNumber(formattedValue) {
            if(!formattedValue) return 0;
            return Number(formattedValue.replace(/\./g, '').replace(/,/g, '.')) || 0;
        }

        document.querySelectorAll('.rupiah-input').forEach(input => {
            input.addEventListener('input', function(e) {
                let cursorPosition = this.selectionStart;
                let originalLength = this.value.length;
                this.value = formatRupiahInput(this.value);
                let newLength = this.value.length;
                cursorPosition = cursorPosition + (newLength - originalLength);
                this.setSelectionRange(cursorPosition, cursorPosition);
            });
        });

        // Setup Icon Picker
        iconOptions.forEach(opt => {
            opt.addEventListener('click', () => {
                iconOptions.forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                iconInput.value = opt.getAttribute('data-icon');
            });
        });

        function setSelectedIcon(iconName) {
            iconOptions.forEach(opt => {
                if(opt.getAttribute('data-icon') === iconName) {
                    opt.classList.add('selected');
                    iconInput.value = iconName;
                } else {
                    opt.classList.remove('selected');
                }
            });
        }

        function showToast(title, message, isError = false) {
            const existing = document.querySelector('.sitenexs-toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `sitenexs-toast ${isError ? 'error' : ''}`;
            toast.innerHTML = `
                <div class="sitenexs-toast-icon"><i class="fas ${isError ? 'fa-exclamation' : 'fa-check'}"></i></div>
                <div class="sitenexs-toast-text">
                    <h4 style="font-size: 0.95rem; font-weight: 800; margin-bottom: 0.1rem;">${title}</h4>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">${message}</p>
                </div>
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        function formatRupiah(angka) {
            if(angka === 0 || !angka) return 'Gratis';
            return 'Rp ' + angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        function addFeatureRow(status = '+', text = '', badgeUrl = '') {
            const row = document.createElement('div');
            row.className = 'feature-row-item';
            row.innerHTML = `
                <select class="feature-status-select">
                    <option value="+" ${status === '+' ? 'selected' : ''}>Aktif (+)</option>
                    <option value="-" ${status === '-' ? 'selected' : ''}>Dicoret (-)</option>
                </select>
                <input type="text" class="feature-text-input" placeholder="Teks fitur (misal: Laporan Keuangan)" value="${text}">
                <input type="url" class="feature-badge-input" placeholder="URL Lencana (Opsional)" value="${badgeUrl}">
                <button type="button" class="btn-remove-feature" title="Hapus Baris"><i class="fas fa-trash"></i></button>
            `;
            
            row.querySelector('.btn-remove-feature').addEventListener('click', () => {
                row.remove();
            });

            featureRowsContainer.appendChild(row);
        }

        btnAddFeatureRow.addEventListener('click', () => {
            addFeatureRow('+', '', '');
        });

        function setFeatureRowsFromMultiline(rawFitur) {
            featureRowsContainer.innerHTML = '';
            if(!rawFitur) {
                addFeatureRow('+', '', '');
                return;
            }

            const lines = rawFitur.split('\n');
            lines.forEach(line => {
                const trimmed = line.trim();
                if(trimmed === '') return;

                let status = '+';
                let content = trimmed;
                if(trimmed.startsWith('+') || trimmed.startsWith('-')) {
                    status = trimmed.substring(0, 1);
                    content = trimmed.substring(1).trim();
                }

                let badgeUrl = '';
                const match = content.match(/\((https?:\/\/[^\s)]+)\)/);
                if(match) {
                    badgeUrl = match[1];
                    content = content.replace(match[0], '').trim();
                }

                addFeatureRow(status, content, badgeUrl);
            });
        }

        function compileFeaturesToMultiline() {
            const rows = featureRowsContainer.querySelectorAll('.feature-row-item');
            let lines = [];
            rows.forEach(row => {
                const status = row.querySelector('.feature-status-select').value;
                const text = row.querySelector('.feature-text-input').value.trim();
                const badge = row.querySelector('.feature-badge-input').value.trim();

                if(text !== '') {
                    let line = `${status} ${text}`;
                    if(badge !== '') {
                        line += ` (${badge})`;
                    }
                    lines.push(line);
                }
            });
            return lines.join('\n');
        }

        function parseFeatureText(rawText) {
            const urlRegex = /(https?:\/\/[^\s)]+)/g;
            let formatted = rawText.replace(urlRegex, (url) => {
                return `<img src="${url}" alt="Badge">`;
            });
            formatted = formatted.replace(/\(\s*(<img[^>]+>)\s*\)/g, '$1');
            return formatted;
        }

        window.updateCountdowns = function() {
            document.querySelectorAll('.countdown-timer').forEach(el => {
                const hoursDuration = Number(el.getAttribute('data-hours')) || 24;
                const isLooping = el.getAttribute('data-loop') === 'true';
                const durationMs = hoursDuration * 60 * 60 * 1000;
                
                const now = new Date().getTime();
                let distance = 0;

                if (isLooping) {
                    distance = durationMs - (now % durationMs);
                } else {
                    const startTime = Number(el.getAttribute('data-start')) || now;
                    const endTime = startTime + durationMs;
                    distance = endTime - now;
                }

                if (distance < 0 && !isLooping) {
                    el.innerHTML = "Diskon telah berakhir";
                } else {
                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    let timeStr = `${hours}j ${minutes}m ${seconds}d`;
                    if(days > 0) {
                        timeStr = `${days}hari ${hours}j ${minutes}m`;
                    }
                    el.innerHTML = `<i class="fas fa-clock"></i> Berakhir: ${timeStr}`;
                }
            });
        }
        setInterval(window.updateCountdowns, 1000);

        async function loadPackagesAdmin() {
            try {
                const querySnapshot = await getDocs(collection(db, "packages"));
                if (querySnapshot.empty) {
                    gridContainer.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 3rem 0;">Belum ada paket tersimpan di database.</p>';
                    return;
                }

                let packages = [];
                querySnapshot.forEach((docSnap) => {
                    packages.push({ id: docSnap.id, ...docSnap.data() });
                });

                packages.sort((a, b) => (Number(a.hargaAsli) || 0) - (Number(b.hargaAsli) || 0));

                gridContainer.innerHTML = '';
                packages.forEach(data => {
                    const docId = data.id;
                    const isPop = data.isPopuler ? true : false;
                    
                    let priceHTML = '';
                    let countdownHTML = '';

                    const hasDiscount = data.hargaDiskon > 0 && data.hargaDiskon < data.hargaAsli;
                    if (hasDiscount) {
                        priceHTML = `
                            <span class="pkg-price-strike">${formatRupiah(data.hargaAsli)}</span>
                            <div class="pkg-price-final">${formatRupiah(data.hargaDiskon)} <span>/bln</span></div>
                        `;
                        const hours = data.countdownJam || 24;
                        const loop = data.perulanganWaktu !== false;
                        const startTime = data.countdownStart || Date.now();
                        countdownHTML = `<div class="pkg-countdown-badge countdown-timer" data-hours="${hours}" data-loop="${loop}" data-start="${startTime}"><i class="fas fa-spinner fa-spin"></i> Memuat waktu...</div>`;
                    } else {
                        priceHTML = `
                            <div class="pkg-price-final">${formatRupiah(data.hargaAsli)} <span>/bln</span></div>
                        `;
                    }

                    const nameBadgeHTML = data.namaBadgeUrl ? `<img src="${data.namaBadgeUrl}" class="pkg-name-badge" alt="Badge" title="Lencana Paket">` : '';

                    const featureLines = data.fitur ? data.fitur.split('\n') : [];
                    let featureHTML = '<ul class="pkg-features-list">';
                    featureLines.forEach(line => {
                        const trimmed = line.trim();
                        if (trimmed.startsWith('+')) {
                            const rawContent = trimmed.substring(1).trim();
                            const parsedContent = parseFeatureText(rawContent);
                            featureHTML += `<li><i class="fas fa-check" style="color: var(--accent); margin-top: 0.2rem; flex-shrink: 0;"></i> <span>${parsedContent}</span></li>`;
                        } else if (trimmed.startsWith('-')) {
                            const rawContent = trimmed.substring(1).trim();
                            const parsedContent = parseFeatureText(rawContent);
                            featureHTML += `<li class="disabled"><i class="fas fa-times" style="color: #ef4444; margin-top: 0.2rem; flex-shrink: 0;"></i> <del>${parsedContent}</del></li>`;
                        } else if(trimmed !== '') {
                            featureHTML += `<li><span>${parseFeatureText(trimmed)}</span></li>`;
                        }
                    });
                    featureHTML += '</ul>';

                    const cardHTML = `
                        <div class="package-admin-card ${isPop ? 'populer' : ''}">
                            ${isPop ? '<span class="badge-populer-tag">Paling Diminati</span>' : ''}
                            <div class="pkg-icon-title">
                                <div class="pkg-icon-box"><i class="fas ${data.icon || 'fa-box'}"></i></div>
                                <div class="pkg-name">${data.namaPaket} ${nameBadgeHTML}</div>
                            </div>
                            <p class="pkg-desc">${data.deskripsi || ''}</p>
                            <div class="pkg-price-box">
                                ${priceHTML}
                                ${countdownHTML}
                            </div>
                            ${featureHTML}
                            <div class="pkg-actions">
                                <button class="btn btn-secondary btn-sm" onclick="window.editPackage('${docId}', '${encodeURIComponent(JSON.stringify(data))}')">
                                    <i class="fas fa-edit"></i> Edit
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="window.deletePackage('${docId}', '${data.namaPaket}')">
                                    <i class="fas fa-trash"></i> Hapus
                                </button>
                            </div>
                        </div>
                    `;
                    gridContainer.insertAdjacentHTML('beforeend', cardHTML);
                });
                window.updateCountdowns();
            } catch (error) {
                console.error(error);
                gridContainer.innerHTML = '<p style="grid-column: 1 / -1; color: red; text-align: center;">Gagal memuat paket dari Firestore.</p>';
            }
        }

        // Buka modal tambah
        btnOpenAddModal.addEventListener('click', () => {
            modalTitleID.innerText = 'Tambah Paket Baru';
            packageForm.reset();
            document.getElementById('packageDocId').value = '';
            setSelectedIcon('fa-box');
            document.getElementById('countdownJam').value = '24';
            document.getElementById('perulanganWaktu').checked = true;
            setFeatureRowsFromMultiline('+ Akses Sistem Kasir\n+ Lencana verifikasi (https://sitenexs.com/assets/logo/lencana.png)');
            packageModal.classList.add('active');
        });

        // Tutup modal
        function closeModal() {
            packageModal.classList.remove('active');
        }
        btnCloseModal.addEventListener('click', closeModal);
        btnCancelModal.addEventListener('click', closeModal);
        packageModal.addEventListener('click', (e) => { if(e.target === packageModal) closeModal(); });

        // Fungsi Global untuk Edit
        window.editPackage = function(docId, encodedData) {
            const data = JSON.parse(decodeURIComponent(encodedData));
            modalTitleID.innerText = 'Edit Paket: ' + data.namaPaket;
            
            document.getElementById('packageDocId').value = docId;
            document.getElementById('namaPaket').value = data.namaPaket || '';
            document.getElementById('namaBadgeUrl').value = data.namaBadgeUrl || '';
            setSelectedIcon(data.icon || 'fa-box');
            document.getElementById('deskripsi').value = data.deskripsi || '';
            document.getElementById('hargaAsli').value = formatRupiahInput(String(data.hargaAsli || 0));
            document.getElementById('hargaDiskon').value = data.hargaDiskon ? formatRupiahInput(String(data.hargaDiskon)) : '';
            document.getElementById('countdownJam').value = data.countdownJam || 24;
            document.getElementById('perulanganWaktu').checked = data.perulanganWaktu !== false;
            document.getElementById('isPopuler').checked = data.isPopuler ? true : false;
            
            setFeatureRowsFromMultiline(data.fitur || '');

            packageModal.classList.add('active');
        }

        // Fungsi Global untuk Hapus
        window.deletePackage = async function(docId, namaPaket) {
            if(confirm(`Apakah Anda yakin ingin menghapus paket "${namaPaket}"?`)) {
                try {
                    await deleteDoc(doc(db, "packages", docId));
                    showToast("Berhasil", `Paket ${namaPaket} telah dihapus.`);
                    loadPackagesAdmin();
                } catch(err) {
                    showToast("Gagal", err.message, true);
                }
            }
        }

        // Submit Form (Tambah / Update)
        packageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const docId = document.getElementById('packageDocId').value.trim();
            const compiledFitur = compileFeaturesToMultiline();

            const rawHargaAsli = parseRupiahToNumber(document.getElementById('hargaAsli').value);
            const rawHargaDiskon = parseRupiahToNumber(document.getElementById('hargaDiskon').value);
            const countdownJam = Number(document.getElementById('countdownJam').value) || 24;
            const perulanganWaktu = document.getElementById('perulanganWaktu').checked;

            const payload = {
                namaPaket: document.getElementById('namaPaket').value.trim(),
                namaBadgeUrl: document.getElementById('namaBadgeUrl').value.trim(),
                icon: document.getElementById('icon').value.trim(),
                deskripsi: document.getElementById('deskripsi').value.trim(),
                hargaAsli: rawHargaAsli,
                hargaDiskon: rawHargaDiskon,
                countdownJam: countdownJam,
                perulanganWaktu: perulanganWaktu,
                countdownStart: Date.now(),
                fitur: compiledFitur,
                isPopuler: document.getElementById('isPopuler').checked
            };

            const btnSave = document.getElementById('btnSavePackage');
            btnSave.disabled = true;
            btnSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

            try {
                if (docId) {
                    await updateDoc(doc(db, "packages", docId), payload);
                    showToast("Berhasil", "Paket berhasil diperbarui.");
                } else {
                    await addDoc(collection(db, "packages"), payload);
                    showToast("Berhasil", "Paket baru berhasil ditambahkan.");
                }
                closeModal();
                loadPackagesAdmin();
            } catch (err) {
                showToast("Gagal", err.message, true);
            } finally {
                btnSave.disabled = false;
                btnSave.innerHTML = 'Simpan Paket';
            }
        });

        loadPackagesAdmin();
    </script>
</body>
</html>
